services:
  - type: web
    name: skillpath-ai
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m backend.seed_jobs && python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_PATH
        value: data/career_coach.sqlite3
      - key: SQLITE_JOURNAL_MODE
        value: WAL
      - key: MONITORING_ENABLED
        value: "true"
      - key: POLL_INTERVAL_SECONDS
        value: "10"
      - key: ENABLE_LLM_EXPLANATIONS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_NOTIFICATIONS_ENABLED
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
    healthCheckPath: /api/health
    plan: free
